<nav class="navbar navbar-default navbar-fixed-top" role="navigation">
  <div class="navbar-inner">
    <div class="container-fluid">
      <div class="header-wrapper">
        <div class="navbar-header">
          <a href="/" class="navbar-brand">
            <img src="assets/images/iep-logo.png" class="logo-img" />
          </a>
        </div>
        <div class="navbar-title">
          <h2 class="head-title">SERVICE MONITOR</h2>
        </div>
        <div class="navbar-controls">
          <div ngbDropdown placement="bottom-end" class="d-inline-block">
            <button class="btn btn-infinity btn-md navbar-btn" id="envDropdown" ngbDropdownToggle
                    [ngbTooltip]="envLinks.length > 1 ? 'Connected to ' + networkEnvironment.toUpperCase() + '. Click to switch.' : 'Connected to ' + networkEnvironment.toUpperCase()"
                    placement="bottom">
              {{ networkEnvironment | titlecase }}
            </button>
            <div ngbDropdownMenu aria-labelledby="envDropdown" class="dropdown-menu-dark">
              <a ngbDropdownItem *ngFor="let link of envLinks" [href]="link.url">
                {{ link.label }}
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid text-center">
  <div ngbAccordion [closeOthers]="false" class="accordion">
    <div ngbAccordionItem [collapsed]="false">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton>Peer Service Status</button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody>
          <ng-template>
            <ng-container *ngTemplateOutlet="statusTable; context: { rows: peers, isPeers: true }"></ng-container>
          </ng-template>
        </div>
      </div>
    </div>

    <div ngbAccordionItem [collapsed]="false">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton>App Status</button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody>
          <ng-template>
            <ng-container *ngTemplateOutlet="statusTable; context: { rows: apps }"></ng-container>
          </ng-template>
        </div>
      </div>
    </div>

    <div ngbAccordionItem [collapsed]="false">
      <h2 ngbAccordionHeader>
        <button ngbAccordionButton>Website Status</button>
      </h2>
      <div ngbAccordionCollapse>
        <div ngbAccordionBody>
          <ng-template>
            <ng-container *ngTemplateOutlet="statusTable; context: { rows: websites }"></ng-container>
          </ng-template>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="footer">
      <div class="col-md-12">
        <small>
          This website is owned by the <span style="color:#ea555d;">Infinity community</span>
          and managed by the <span style="color:#ea555d;">Infinity Foundation.</span>
          Version: {{ releaseVersion }}
        </small>
      </div>
    </div>
  </div>
</div>

<ng-template #statusTable let-rows="rows" let-isPeers="isPeers">
  <div class="table-responsive">
    <table class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>Name</th>
          <th>IP</th>
          <th>Last check</th>
          <th>Status</th>
          <th>Check</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows">
          <td><strong>{{ row.label }}</strong></td>
          <td>
            <a [href]="row.url" target="_blank" style="color: inherit; text-decoration: none;">
              {{ row.ip }}
            </a>
          </td>
          <td>{{ statusOf(row)?.timestamp }}</td>
          <td>
            <ng-container *ngIf="statusOf(row) as s; else unknown">
              <i *ngIf="s.online" class="bi bi-circle-fill text-success" style="font-size: 14px;" title="Online"></i>
              <i *ngIf="!s.online" class="bi bi-circle-fill text-danger" style="font-size: 14px;" title="Offline"></i>
            </ng-container>
            <ng-template #unknown>
              <span class="text-muted">…</span>
            </ng-template>
          </td>
          <td>
            <button class="btn btn-monitor-check" (click)="check(row)" [disabled]="checking[row.url]">
              {{ checking[row.url] ? 'Checking...' : 'Check' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-template>
